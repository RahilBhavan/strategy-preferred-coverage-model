<figure class="figure" id="calculator"><h4>Stress the dividend coverage snapshot</h4><p class="fl">Change BTC price, net mNAV and STRC rate. All other inputs stay at the October 15 snapshot.</p><div class="calc-grid"><label for="btc-input">Bitcoin price<output id="btc-label">$82,131</output><input id="btc-input" type="range" min="10000" max="200000" step="1" value="82131"></label><label for="mnav-input">Net mNAV<output id="mnav-label">1.175x</output><input id="mnav-input" type="range" min="0.5" max="2.5" step="0.001" value="1.1745671782680673"></label><label for="rate-input">STRC annual rate<output id="rate-label">12.0%</output><input id="rate-input" type="range" min="0.08" max="0.20" step="0.001" value="0.12"></label></div><div class="calc-result" aria-live="polite" aria-atomic="true" id="calc-result">Reserve covers 37.5 months. Reserve plus common capacity covers 15.2 years.</div><p id="calc-detail"></p><button id="calc-reset" type="button">Reset snapshot</button><figcaption class="calc-source">Snapshot only. Principal excluded; observed moneyness fixed. A 1x issuance gate and 2% share of ADV are model assumptions. ATM authorization is not committed demand. For puts, fees, dilution and declining market access, open Quarterly path in Excel. <a href="https://www.sec.gov/Archives/edgar/data/1050446/000119312526419726/mstr-ex99_1.htm">Liquidity source</a>; <a href="https://www.strategy.com/notes">metric definition</a>.</figcaption><noscript><p>The static snapshot is shown above. Enable JavaScript to change assumptions, or use the Excel workbook.</p></noscript></figure>
