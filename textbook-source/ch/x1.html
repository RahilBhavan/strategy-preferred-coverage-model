<section class="chapter" id="x1">
<span class="ch-num">Appendix A</span>
<h2>Formula sheet</h2>
<div class="prose"><p>Every calculation in this book, in one place. $ figures in millions unless noted. Example values are the Oct 2026 snapshot.</p></div>
<figure class="figure">
<div class="tbl"><table>
<thead><tr><th>Measure</th><th>Formula</th><th class="r">Example</th></tr></thead>
<tbody>
<tr><td>Annual dividend on a preferred</td><td>stated amount × shares × rate</td><td class="r">STRC: 8,792 × 12% = 1,055</td></tr>
<tr><td>Current yield</td><td>annual dividend ÷ market price</td><td class="r">$10 ÷ $80 = 12.5%</td></tr>
<tr><td>Annual cash charges</td><td>Σ cash dividends + debt interest</td><td class="r">1,560</td></tr>
<tr><td>Reserve coverage (months)</td><td>USD Reserve ÷ annual charges × 12</td><td class="r">4,880 ÷ 1,560 × 12 = 37.5</td></tr>
<tr><td>Headroom over policy</td><td>Reserve − charges × (policy months ÷ 12)</td><td class="r">4,880 − 1,560 = 3,320</td></tr>
<tr><td>Net assets</td><td>bitcoin + cash − debt − preferred</td><td class="r">69,668 + 5,521 − 20,503 = 54,686</td></tr>
<tr><td>Basic mNAV</td><td>market cap ÷ bitcoin value</td><td class="r">63,808 ÷ 69,668 = 0.92x</td></tr>
<tr><td>Enterprise-value mNAV</td><td>(market cap + debt + preferred − cash) ÷ bitcoin value</td><td class="r">1.13x</td></tr>
<tr><td>Net mNAV</td><td>share price ÷ (net bitcoin per diluted share × BTC price)</td><td class="r">≈ 1.17–1.19x</td></tr>
<tr><td>Leverage of common at NAV</td><td>bitcoin value ÷ net assets</td><td class="r">69,668 ÷ 54,686 = 1.27x</td></tr>
<tr><td>BTC cover through a rank</td><td>bitcoin value ÷ cumulative claims through that rank</td><td class="r">STRD: 3.4x</td></tr>
<tr><td>BTC price where cover = 1.0x</td><td>cumulative claims ÷ BTC held</td><td class="r">20,503 ÷ 848,250 = $24,171</td></tr>
<tr><td>Carry as % of bitcoin</td><td>annual charges ÷ bitcoin value</td><td class="r">1,560 ÷ 69,668 = 2.2%</td></tr>
<tr><td>Dilution to fund a year</td><td>annual charges ÷ market cap</td><td class="r">≈ 2.4%</td></tr>
<tr><td>Change in net bitcoin per share from selling common</td><td>k × (1 − 1/m), with k = $ raised ÷ (BTC price × shares)</td><td class="r">adds when m &gt; 1</td></tr>
<tr><td>Rotation break-even (sell common, retire preferred)</td><td>adds while m &gt; preferred price ÷ $100</td><td class="r">STRC below $100 × m</td></tr>
<tr><td>Years covered by Reserve + stock sales</td><td>if s &lt; C and the ATM lasts: R ÷ (C − s); else (R + ATM) ÷ C</td><td class="r">15.2 yrs (capacity, not a forecast)</td></tr>
</tbody></table></div>
<figcaption>R = Reserve, C = annual charges, s = stock sales per year, m = net mNAV. Sources and dates for every input: <a class="xref" href="#sources">Appendix C</a>.</figcaption>
</figure>
</section>
